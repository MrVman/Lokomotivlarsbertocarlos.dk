<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galleri — Lokomotiv Larsbertocarlos</title>
  <meta name="description" content="Matchreferater og Award Show fra @larsbertocarlos. #chuchu #merekul">
  <meta name="theme-color" content="#0c0c0d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="galleri">
  <div id="site-header"></div>
  <header class="page-hero">
    <div class="wrap">
      <p class="kicker">Medier</p>
      <h1>Galleri</h1>
      <p class="lede">Seneste Award Show er embeddet her. Kampkortene linker til de rigtige Instagram-opslag.</p>
    </div>
  </header>
  <section class="section">
    <div class="wrap">
      <div class="gala-stage gala-stage-compact">
        <figure class="gala-frame">
          <div class="ig-embed" data-ig-embed></div>
        </figure>
        <div class="gala-program">
          <p class="gala-program-kicker">Seneste galla</p>
          <h2>Award Show</h2>
          <ul class="award-list" id="award-winners"></ul>
        </div>
      </div>
      <div class="filters">
        <button class="filter-btn is-on" type="button" data-filter="alle">Alle</button>
        <button class="filter-btn" type="button" data-filter="kamp">Kampe</button>
        <button class="filter-btn" type="button" data-filter="award">Award Show</button>
        <button class="filter-btn" type="button" data-filter="historie">Historie</button>
      </div>
      <div class="gallery-grid" id="gallery"></div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
