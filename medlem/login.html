<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medlemslogin — Lokomotiv Larsbertocarlos</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0c0d">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="login">
  <div id="site-header"></div>
  <section class="section">
    <div class="card login-box">
      <p class="kicker">Lukket land</p>
      <h1>Medlemsportal</h1>
      <p class="lede">Numre, referater, Holdsport og bøder. Koden får du af holdlederen.</p>
      <form id="login-form">
        <label>Kodeord<input name="password" type="password" required autocomplete="current-password"></label>
        <p class="notice" id="login-err" hidden>Forkert kode. Prøv igen, eller skriv til holdlederen.</p>
        <button class="btn btn-primary" type="submit">Log ind</button>
      </form>
      <p class="form-note">Standardkoden står i config.js og skal skiftes efter første deploy. Til rigtig adgangskontrol: Cloudflare Access.</p>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/portal.js"></script>
</body>
</html>
